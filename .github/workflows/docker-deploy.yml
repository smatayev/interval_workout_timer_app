name: Build Docker image and Deploy the App to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/interval-timer-app:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/interval-timer-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          TAG: ${{ github.sha }}
          PORT: ${{ secrets.PORT }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_REGISTRY,TAG,PORT,DOCKER_USER,DOCKER_PASSWORD
          script: |
            set -e

            mkdir -p ~/interval-timer-app
            cd ~/interval-timer-app

            # Write docker-compose.yml with variable placeholders (single-quoted
            # heredoc prevents shell expansion; docker compose resolves them from .env)
            cat > docker-compose.yml <<'EOF'
            version: '3.9'
            services:
              interval-timer-app:
                image: ${DOCKER_REGISTRY}/interval-timer-app:${TAG}
                ports:
                  - "${PORT:-80}:80"
                restart: always
                healthcheck:
                  test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 10s
            EOF

            # Write .env so docker compose resolves the variables above
            cat > .env <<EOF
            DOCKER_REGISTRY=${DOCKER_REGISTRY}
            TAG=${TAG}
            PORT=${PORT}
            EOF

            # Authenticate, pull, and restart
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker compose ps
